# Render Blueprint — free tier variant.
#
# Use this when you want a live URL at $0 with no PC of your own running the app.
# Trade-off (Render's own free-tier rules): the service spins down after 15
# minutes without traffic (first request then takes ~1 minute) and the container
# filesystem is ephemeral, so capsules created here are lost on every redeploy,
# restart or spin-down. Export the capsules you care about as .scapsule files and
# re-import them after a rebuild.
#
# For a permanent library, deploy render.yaml instead (0.5c-512mb plan + 1 GB
# disk): same app, same URL shape, data survives.
services:
  - type: web
    name: smart-capsule
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Ephemeral inside the container, but a writable path the non-root user owns.
      - key: SMART_CAPSULE_HOME
        value: /tmp/data
      - key: SMART_CAPSULE_HOST
        value: 0.0.0.0
      - key: SMART_CAPSULE_ALLOW_REMOTE
        value: "1"
    # No password is required by this blueprint, matching the local setup. To lock
    # the public URL later, add SMART_CAPSULE_PASSWORD under Environment in the
    # Render dashboard and redeploy; every request then needs HTTP Basic auth.
